<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="heron">
  <title>heron</title>
  <!--
    heron 标识：H 的变形 —— 科技与自然的结合
    字母 —— H 是 heron 的首字母；左竖写成苍鹭的颈（上窄下宽），左上长出苍鹭的长喙
    自然 —— 苍鹭的头：细长的喙、基部的眼
    科技 —— 右竖上接一段直角走线的电路，末端是一枚分离的数据点
    构图 —— 主体居中、几乎撑满 48×48 画布，背景透明
             （外圈一圈暗色描边，只在浅色背景上起作用，保证 favicon 也读得出）
  -->
  <defs>
    <linearGradient id="heronIconBrand" x1="3" y1="3" x2="45" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6ff5c" />
      <stop offset=".55" stop-color="#dcfd35" />
      <stop offset="1" stop-color="#8fe3ff" />
    </linearGradient>

    <!-- 主体形状：喙 / 颈 / 右竖 / 横杠 -->
    <mask id="heronIconBody" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <g transform="translate(24 24) scale(1.3) translate(-28.2 -24.5)">
        <g fill="#fff">
          <path d="M12 11.5 L43 8 L12 17 Z" />
          <path d="M12.5 16 L19 16.4 C19.4 24 19.8 32 20.6 41 L13.6 41 C13.8 32 13 24 12.5 16 Z" />
          <rect x="28" y="13" width="6.6" height="28" rx="1.4" />
          <rect x="12.5" y="24" width="15.5" height="6.6" rx="1.4" />
        </g>
        <!-- 眼 -->
        <circle cx="17.6" cy="13.4" r="1.55" fill="#000" />
      </g>
    </mask>

    <!-- 描边用的实心剪影（放大 5%，垫在主体下面） -->
    <mask id="heronIconHalo" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <g transform="translate(24 24) scale(1.365) translate(-28.2 -24.5)">
        <g fill="#fff">
          <path d="M12 11.5 L43 8 L12 17 Z" />
          <path d="M12.5 16 L19 16.4 C19.4 24 19.8 32 20.6 41 L13.6 41 C13.8 32 13 24 12.5 16 Z" />
          <rect x="28" y="13" width="6.6" height="28" rx="1.4" />
          <rect x="12.5" y="24" width="15.5" height="6.6" rx="1.4" />
        </g>
      </g>
    </mask>
  </defs>

  <!-- 暗色描边（浅底可见，深底不可见） -->
  <rect width="48" height="48" fill="#040319" mask="url(#heronIconHalo)" />
  <!-- 主体 -->
  <rect width="48" height="48" fill="url(#heronIconBrand)" mask="url(#heronIconBody)" />

  <!-- 电路走线 + 数据点 -->
  <g
    stroke="url(#heronIconBrand)"
    stroke-width="1.9"
    fill="none"
    stroke-linejoin="miter"
    transform="translate(24 24) scale(1.3) translate(-28.2 -24.5)"
  >
    <path d="M34.6 27.3 L40 27.3 L40 17.5"></path>
  </g>
  <circle
    cx="42.6"
    cy="17.5"
    r="2.2"
    fill="#040319"
    transform="translate(24 24) scale(1.3) translate(-28.2 -24.5)"
  ></circle>
  <circle
    cx="42.6"
    cy="17.5"
    r="1.7"
    fill="#8fe3ff"
    transform="translate(24 24) scale(1.3) translate(-28.2 -24.5)"
  ></circle>
</svg>
