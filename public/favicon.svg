<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="heron">
  <title>heron</title>
  <!--
    徽章版：深底圆角方块 + 标识。
    浏览器标签页的明暗主题、以及浅色页面上的 favicon，都需要深底才读得出青柠色。
  -->
  <defs>
    <linearGradient id="heronBadgeBrand" x1="6" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6ff5c" />
      <stop offset=".55" stop-color="#dcfd35" />
      <stop offset="1" stop-color="#8fe3ff" />
    </linearGradient>
    <mask id="heronBadgeCut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <g transform="translate(-11.3 -6.35) scale(1.26)">
        <path
          fill="#fff"
          d="M46.4 15.2 L32.5 12.0 C29.1 11.5 27.5 14.5 29.2 16.7 C31.5 20.2 27.9 24.6 26.9 29.6 L22.2 29.6 C22.9 24.4 26.6 20.4 30.6 17.8 L36.9 17.3 Z"
        />
        <path
          fill="#fff"
          d="M26.9 29.6 C26.1 34.2 27.2 38.6 29.9 41.9 L23.7 41.9 C20.7 38.3 19.4 33.4 22.2 29.6 Z"
        />
        <circle cx="33.5" cy="13.9" r="2.3" fill="#000" />
      </g>
    </mask>
  </defs>

  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="#07061f" />
  <rect x="1.5" y="1.5" width="45" height="45" rx="11" fill="none" stroke="rgba(238,238,238,.16)" />

  <!-- 标识缩到 0.8 居中放进方块，四周留出安全边距 -->
  <g transform="translate(24 24) scale(0.8) translate(-31 -25.6)">
    <rect width="48" height="48" fill="url(#heronBadgeBrand)" mask="url(#heronBadgeCut)" />
    <g stroke="url(#heronBadgeBrand)" stroke-width="1.9" fill="none" stroke-linejoin="miter">
      <path d="M31.6 9.4 L31.6 4.8 L38.4 4.8" />
    </g>
    <circle cx="43" cy="4.8" r="1.6" fill="#8fe3ff" />
  </g>
</svg>
